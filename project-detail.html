<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Project | Umair Khan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#25202e;background:#fcfbff;font:16px/1.7 Inter,Segoe UI,Roboto,Arial,sans-serif;text-align:center}
    .status{max-width:520px}
    .status h1{margin:0 0 .6rem;font-size:1.6rem;letter-spacing:-.03em}
    .status p{margin:0 0 1.2rem;color:#6d6678}
    .status a{display:inline-flex;align-items:center;gap:.5rem;min-height:46px;padding:.65rem 1.15rem;border:1px solid #dcd0ee;border-radius:11px;color:#25202e;background:#fff;font-weight:800;text-decoration:none}
    .status a:hover{border-color:#bba2e9;background:#eee5ff}
  </style>
</head>
<body>
  <div class="status">
    <h1 id="status-title">Opening project…</h1>
    <p id="status-text">Loading the project details from the portfolio.</p>
    <a href="index.html#projects">&#8592; Back to Projects</a>
  </div>
  <script src="projects-data.js"></script>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search || "");
      var id = (params.get("id") || params.get("project") || "").trim().toLowerCase();
      var list = window.PROJECTS || [];
      var found = null;
      for (var i = 0; i < list.length; i++) {
        var project = list[i];
        var aliases = project.aliases || [];
        if (project.id === id || aliases.indexOf(id) !== -1) { found = project; break; }
      }
      if (found) {
        window.location.replace("index.html#/project/" + found.id);
      } else {
        document.getElementById("status-title").textContent = "Project not found";
        document.getElementById("status-text").textContent = id
          ? 'No project matches "' + id + '".'
          : "This page needs a project id, for example project-detail.html?id=luxe.";
      }
    }());
  </script>
</body>
</html>
